name: Apply yearly UI fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'fix/yearly-person-initial-render'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch initial yearly rankings request
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/RankingsPage.tsx')
          source = path.read_text()
          old_signature = '''async function getInitialRankings(
            searchParams: Record<string, string | string[] | undefined>,
            focusedWcaId = "",
          ) {'''
          new_signature = '''async function getInitialRankings(
            searchParams: Record<string, string | string[] | undefined>,
            focusedWcaId = "",
            yearOverride: number | null = null,
          ) {'''
          if old_signature in source:
              source = source.replace(old_signature, new_signature, 1)
          elif new_signature not in source:
              raise SystemExit('getInitialRankings signature did not match')

          old_year = '  const year = getSearchParam(searchParams, "year");'
          new_year = '''  const year = yearOverride === null
            ? getSearchParam(searchParams, "year")
            : String(yearOverride);'''
          if old_year in source:
              source = source.replace(old_year, new_year, 1)
          elif new_year not in source:
              raise SystemExit('year lookup did not match')

          old_call = '    ? getInitialRankings(resolvedSearchParams, focusedWcaId)'
          new_call = '''    ? getInitialRankings(
                resolvedSearchParams,
                focusedWcaId,
                initialYear,
              )'''
          if old_call in source:
              source = source.replace(old_call, new_call, 1)
          elif new_call not in source:
              raise SystemExit('initial rankings call did not match')

          path.write_text(source)

          Path('tests/yearly-person-route.test.ts').write_text('''import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";
          import test from "node:test";

          test("passes the path year into the initial server rankings request", async () => {
            const source = await readFile(
              new URL("../app/RankingsPage.tsx", import.meta.url),
              "utf8",
            );

            assert.match(
              source,
              /const year = yearOverride === null[\\s\\S]*String\\(yearOverride\\)/,
            );
            assert.match(
              source,
              /getInitialRankings\\([\\s\\S]*resolvedSearchParams,[\\s\\S]*focusedWcaId,[\\s\\S]*initialYear,[\\s\\S]*\\)/,
            );
          });
          ''')
          PY
          npx eslint app/RankingsPage.tsx tests/yearly-person-route.test.ts
          npm run test:unit -- --test-name-pattern='path year'
      - name: Commit fix
        run: |
          if git diff --quiet -- app/RankingsPage.tsx tests/yearly-person-route.test.ts; then
            echo 'Fix already applied.'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app/RankingsPage.tsx tests/yearly-person-route.test.ts
          git commit -m 'Fix initial yearly person rankings render'
          git push origin HEAD:${{ github.head_ref }}
