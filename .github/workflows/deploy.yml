name: Deploy CubeRanks

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: 159.223.195.0
      DEPLOY_USER: www

    steps:
      - name: Check out main
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate
        run: |
          npm ci
          npm run lint
          npm test

      - name: Configure deployment SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image in GitHub Actions
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: wcarankings-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Copy deployment configuration
        run: |
          ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            'install -d -m 0755 /srv/wcarankings/ops'
          scp -q -o BatchMode=yes docker-compose.yml \
            "$DEPLOY_USER@$DEPLOY_HOST:/srv/wcarankings/docker-compose.yml"
          scp -q -o BatchMode=yes ops/Caddyfile \
            "$DEPLOY_USER@$DEPLOY_HOST:/srv/wcarankings/ops/Caddyfile"

      - name: Load image and switch production services
        run: |
          set -o pipefail
          ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            'cd /srv/wcarankings && docker compose stop app || true; docker compose rm -f app || true; docker image ls --format "{{.ID}}" wcarankings-app | sort -u | xargs -r docker image rm -f; docker builder prune -af; docker image prune -f'
          docker save "wcarankings-app:${GITHUB_SHA}" \
            | gzip -1 \
            | ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
                'gzip -d | docker load'
          ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker tag wcarankings-app:${GITHUB_SHA} wcarankings-app:latest && cd /srv/wcarankings && docker compose up -d --no-build --remove-orphans app proxy"

      - name: Verify deployment
        run: |
          ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            'cd /srv/wcarankings && docker compose ps && for attempt in $(seq 1 30); do curl --fail --silent http://127.0.0.1:3000/ >/dev/null && exit 0; sleep 2; done; docker compose logs --tail=80 app; exit 1'
