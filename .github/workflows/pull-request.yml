name: Pull Request Checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      MYSQL_DATABASE: wcarankings
      MYSQL_USER: wcarankings
      MYSQL_PASSWORD: local-development-password
      MYSQL_ROOT_PASSWORD: local-root-password
      DATABASE_URL: mysql://wcarankings:local-development-password@db:3306/wcarankings

    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Flyway migrations
        run: |
          docker compose up -d db
          docker compose build flyway
          docker compose run --rm flyway migrate
          docker compose run --rm flyway info
          docker compose run --rm flyway validate

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: wcarankings-app:pull-request
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify production image contents
        run: |
          docker run --rm --entrypoint sh wcarankings-app:pull-request -c \
            'test -f /app/docker-entrypoint.sh && test -f /app/scripts/check-ranking-projections.mjs && test -f /app/scripts/sync-wca-export.mjs && test -f /app/scripts/refresh-rankings.mjs'

      - name: Build and verify Flyway image
        run: |
          docker build --file Dockerfile.flyway --tag wcarankings-flyway:pull-request .
          docker run --rm --entrypoint sh wcarankings-flyway:pull-request -c \
            'test -f /flyway/migrations/V1__export_metadata.sql && test -f /flyway/migrations/V2__import_health.sql'
